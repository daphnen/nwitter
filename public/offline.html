<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf3f8" />
    <title>연결이 끊겼어요 🐾</title>
    <!--
      서비스워커가 오프라인일 때 대신 보여주는 화면입니다.
      네트워크가 없는 상태에서 뜨므로 폰트·CSS·이미지를 하나도 불러오지 않고,
      전부 이 파일 안에 들어 있어야 합니다.
    -->
    <style>
      :root {
        --bg-base: #fdf3f8;
        --card-bg: #ffffff;
        --card-border: #f2dbe8;
        --text: #4a3340;
        --text-muted: #7b5f70;
        --accent: #d95b8a;
        --on-accent: #ffffff;
        --shadow: 0 10px 30px rgba(180, 120, 155, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-base: #241a22;
          --card-bg: #2f2430;
          --card-border: #43334029;
          --text: #f3e6ee;
          --text-muted: #c7aebd;
          --accent: #f08cb4;
          --on-accent: #2a1c25;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: var(--bg-base);
        background-image:
          radial-gradient(1100px 560px at 8% -10%, #ffd9e8, transparent 62%),
          radial-gradient(950px 520px at 95% -4%, #e3dcfb, transparent 58%);
        background-repeat: no-repeat;
        color: var(--text);
        font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic",
          system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-image:
            radial-gradient(1100px 560px at 8% -10%, #4b2a44, transparent 62%),
            radial-gradient(950px 520px at 95% -4%, #2f2a4d, transparent 58%);
        }
      }

      .card {
        width: 100%;
        max-width: 360px;
        padding: 34px 26px 28px;
        text-align: center;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      .cat {
        display: block;
        margin: 0 auto 14px;
        animation: bob 2.4s ease-in-out infinite;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-muted);
      }

      button {
        margin-top: 22px;
        min-height: 48px;
        padding: 0 28px;
        font: inherit;
        font-weight: 700;
        color: var(--on-accent);
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      button:active {
        transform: scale(0.96);
      }

      @media (prefers-reduced-motion: reduce) {
        .cat {
          animation: none;
        }
        button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="cat" width="104" height="104" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M22 44 L26 10 L54 30 Z" fill="#fff" stroke="#6a4c5e" stroke-width="3" stroke-linejoin="round"/>
        <path d="M98 44 L94 10 L66 30 Z" fill="#fff" stroke="#6a4c5e" stroke-width="3" stroke-linejoin="round"/>
        <path d="M30 38 L32 20 L46 31 Z" fill="#ffe3ee"/>
        <path d="M90 38 L88 20 L74 31 Z" fill="#ffe3ee"/>
        <ellipse cx="60" cy="64" rx="43" ry="37" fill="#fff" stroke="#6a4c5e" stroke-width="3"/>
        <path d="M40 60 q6 -5 12 0" fill="none" stroke="#6a4c5e" stroke-width="3" stroke-linecap="round"/>
        <path d="M68 60 q6 -5 12 0" fill="none" stroke="#6a4c5e" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="34" cy="72" rx="7.5" ry="5" fill="#f5a3c1" opacity="0.55"/>
        <ellipse cx="86" cy="72" rx="7.5" ry="5" fill="#f5a3c1" opacity="0.55"/>
        <path d="M56.5 70 L63.5 70 L60 74 Z" fill="#f5a3c1"/>
        <path d="M53 79 q7 -5 14 0" fill="none" stroke="#6a4c5e" stroke-width="2.6" stroke-linecap="round"/>
        <g stroke="#6a4c5e" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
          <path d="M20 62 L34 65"/><path d="M19 72 L34 72"/>
          <path d="M100 62 L86 65"/><path d="M101 72 L86 72"/>
        </g>
      </svg>

      <h1>인터넷이 안 닿아요</h1>
      <p>
        기록은 그대로 잘 있어요.<br />
        연결되면 다시 눌러 주세요 🐾
      </p>

      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>

    <script>
      // 연결이 돌아오면 알아서 원래 화면으로 되돌아갑니다.
      addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
